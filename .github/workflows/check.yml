name: Check iPhone Duo pickup

on:
  # Main trigger: cron-job.org calls the GitHub API every minute (see README).
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification instead of checking"
        type: boolean
        default: false
  # Backup in case the external pinger stops. GitHub often runs this late.
  schedule:
    - cron: "*/10 * * * *"

# Never run two checks at once; skip a new run if one is in progress.
concurrency:
  group: check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check availability
        env:
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
        run: node check.mjs ${{ inputs.test_notify && '--test-notify' || '' }}

      # Commit state.json only when it changed, so alerts aren't repeated.
      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update availability state"
            git push
          fi
